{% extends 'base.html' %}

{% block title %}Categories - JAY DEE'S{% endblock %}

{% block content %}
<div class="row">
    <div class="col-12">
        <h2 class="mb-4">All Categories</h2>
    </div>

    {% for category in categories %}
        <div class="col-md-4 mb-4">
            <div class="card h-100 text-center category-card">
                <div class="card-body d-flex flex-column">
                    <h5 class="card-title">{{ category.name|title }}</h5>
                    <p class="card-text">{{ category.description }}</p>
                    <a href="{% url 'products:category_detail' category.slug %}" class="btn btn-primary mt-auto">Shop Now</a>
                </div>
            </div>
        </div>
    {% endfor %}
</div>
{% endblock %}
